<!DOCTYPE html>
<html>
    <head>
        <title>Formcontrols</title>
    </head>
    <body>
        <form >
            <input type="text" placeholder="enter ur name" maxlength="8">
            <textarea name="" id="" cols="30" rows="" maxlength="100"></textarea>
            <input type="number" max="27" min="1" step="2" >
            <input type="tel" maxlength="10" required >
            <input type="text" value="terms" readonly >
            <input type="text" value="hyderabad" disabled >
            <input type="text" size="10">
            <input type="password" pattern="[A-a-z-Z]">

            <input type="submit">
        </form>
    </body>
</html>
