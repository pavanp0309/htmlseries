<!DOCTYPE html> <!-- tells current version of html : HTML5-->
<html>
    <head>
        <title>FormElements</title>
    </head>
    <body>
    
        <form >
            <label for="">FullName</label>
            <input type="text"><br>

            <select name="" id="" >
                <option value="">Ind</option>
                <option value="">Pak</option>
                <option value="">china</option>
                <option value="" selected>usa</option>
            </select>

<!-- optgrough -->
            <select name="" id="" >
                <optgroup label="Mobile">
                <option value="">vivo</option>
                <option value="">iphone</option>
                <option value="">sumsung</option>
                </optgroup>
                <optgroup label="Laptops">
                    <option value="">Dell</option>
                    <option value="">Mac</option>
                    <option value="">lenovo</option>
                </optgroup>
            </select>

<!-- Review   -->
<textarea name="" id="" cols="20" rows="5"></textarea>    
        </form><br>

        <!-- form with different field set -->
         <form >
              <fieldset>
                <legend>Personal info</legend>
                <label for="">FullName</label><br>
              <input type="text" name="" id="" placeholder="enter ur name"><br>
              <label for="">Mobile</label><br>
              <input type="tel" name="" id="" placeholder="enter ur Mobile"><br>

              </fieldset>
              <fieldset >
                <legend>education</legend>
                <label for="">Degreee</label><br>
              <select name="" id="">
                <option value="">BTECH</option>
                <option value="">Degree</option>
                <option value="">Intermeadite</option>
                <option value="">Mba</option>
              </select><br>
              <label for="">Certification</label><br>
              <input type="text" placeholder="enter ur certification"><br>
              </fieldset>
              


             <fieldset>
                <legend>Parent info</legend>
                <label for="">parent Name</label><br>
                <input type="text" placeholder="enter ur ParentName"><br>
                <label for="">Mobile</label><br>
                <input type="tel" name="" id="" placeholder="enter ur Mobile">
             </fieldset>
         </form>

        <!-- datalist:predefined option the users -->
         <form >
            <input list="codes">
            <datalist id="codes">
              <option value="+91"></option>
              <option value="+76"></option>
              <option value="+89"></option>
              <option value="+65"></option>
            </datalist>
         </form>
         <form action="">
            <button type="submit">submit</button>
            <button type="reset">reset</button>
            <button type="button">click</button>
         </form>

    </body>
</html>
